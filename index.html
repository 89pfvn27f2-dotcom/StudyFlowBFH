function supportedLanguage(value){return Object.hasOwn(LANGUAGES,value)}
function initialLanguage(){
  try{const saved=globalThis.localStorage?.getItem(LANGUAGE_KEY);if(supportedLanguage(saved))return saved}catch{}
  for(const entry of globalThis.navigator?.languages||[globalThis.navigator?.language||'en']){
    const candidate=String(entry).toLowerCase().split(/[-_]/)[0];if(supportedLanguage(candidate))return candidate;
  }
  return 'en';
}
let language=initialLanguage();
function locale(){return LANGUAGES[language].locale}
function t(message,values={}){
  message=String(message??'');
  const text=language==='en'?message:TRANSLATIONS[message]?.[language]||message;
  return text.replace(/\{([a-zA-Z]+)\}/g,(match,key)=>Object.hasOwn(values,key)?String(values[key]):match);
}
function tx(message,values={}){return esc(t(message,values))}
function countText(one,many,count){return t(new Intl.PluralRules(locale()).select(count)==='one'?one:many,{count:new Intl.NumberFormat(locale()).format(count)})}
function rememberLanguage(){try{globalThis.localStorage?.setItem(LANGUAGE_KEY,language)}catch{}}
function syncDocumentLanguage(){document.documentElement?.setAttribute('lang',language)}
function applySavedLanguage(){if(supportedLanguage(state.profile.language))language=state.profile.language;rememberLanguage();syncDocumentLanguage()}
function languagePicker(id){return `<div class="language-picker"><label for="${id}">${tx('Language')}</label><select id="${id}" name="interfaceLanguage" data-language ${authBusy||isLoading||isSaving?'disabled':''}>${Object.entries(LANGUAGES).map(([value,info])=>`<option value="${value}" lang="${value}" ${value===language?'selected':''}>${info.name}</option>`).join('')}</select></div>`}
function captureVisibleForm(){
  const form=app.querySelector('form');if(!form)return null;
  return {id:form.id,values:Array.from(form.elements).filter(el=>el.name&&el.type!=='submit'&&el.type!=='button').map(el=>({name:el.name,value:el.value}))};
}
function restoreVisibleForm(snapshot){
  if(!snapshot)return;const form=document.getElementById(snapshot.id);
  for(const entry of snapshot.values){const el=form?.elements?.namedItem(entry.name);if(el)el.value=entry.value}
}
async function changeLanguage(value,control){
  if(!supportedLanguage(value)||value===language)return false;
  if(authBusy||isLoading||isSaving||pendingAccountDeletion){if(control)control.value=language;return false}
  const previous=language,snapshot=captureVisibleForm();
  if(currentUser&&cloudLoaded&&setupActive()&&!setupNotice)captureSetupForm(document.getElementById('setup-form'));
  language=value;
  if(currentUser&&cloudLoaded&&!isRecovery&&!needsSetup()&&!setupDraft){
    const oldValue=state.profile.language,epoch=authEpoch,userId=currentUser.id;
    state.profile.language=value;
    try{
      const saving=persist();render();restoreVisibleForm(snapshot);await saving;
      if(epoch!==authEpoch||currentUser?.id!==userId)return false;
      rememberLanguage();render();restoreVisibleForm(snapshot);toast('Language saved.');return true;
    }catch(error){
      if(epoch!==authEpoch||currentUser?.id!==userId)return false;
      state.profile.language=oldValue;language=previous;rememberLanguage();render();restoreVisibleForm(snapshot);toast(accountMessage(error));return false;
    }
  }
  state.profile.language=value;if(setupDraft)setupDraft.profile.language=value;
  rememberLanguage();render();restoreVisibleForm(snapshot);return true;
}

function syncTaskGroup(){
  const type=document.getElementById('task-type');if(!type)return;
  const shared=type.value==='group',select=document.getElementById('task-group'),module=document.getElementById('entry-module');

  for(const option of Array.from(module.options))if(option.dataset.inheritedModule)option.remove();
  document.getElementById('task-group-field').hidden=!shared;
  module.disabled=inherited;
  if(inherited){
    if(!Array.from(module.options).some(option=>option.value===group.moduleId)){
      const snapshot=group.moduleSnapshot||moduleFor(group.moduleId),option=document.createElement('option');
      option.value=group.moduleId;option.textContent=snapshot.name+(snapshot.code?' · '+snapshot.code:'');option.dataset.inheritedModule='true';module.appendChild(option);

    module.value=state.modules.some(m=>m.id===module.dataset.previousOwnModule)?module.dataset.previousOwnModule:state.modules[0]?.id||'';

const motivationHistory=new Map();
let motivationVisit=0,motivationChoice=null;
function dailyMotivation(done,total){
  const fraction=total?done/total:0;
  const stage=!total?'empty':done===total?'complete':!done?'start':fraction<.25?'early':fraction<.5?'quarter':fraction<.75?'half':'near';
  const key=JSON.stringify([state.activeUser,today,motivationVisit,done,total]);
  if(motivationChoice?.key!==key){
    const historyKey=JSON.stringify([state.activeUser,today,stage]),choices=MOTIVATION_MESSAGES[stage];
    const previous=motivationHistory.get(historyKey);
    const index=previous===undefined?Math.floor(Math.random()*choices.length):(previous+1)%choices.length;
    motivationHistory.set(historyKey,index);
    motivationChoice={key,message:choices[index]};
  }
  return motivationChoice.message;
}

function captureSetupForm(form){
  const draft=ensureSetupDraft(),value=name=>form?.elements?.namedItem(name)?.value;
  if(setupStep===1){
    for(const name of ['name','degree','studyMode','semesterTerm','semesterYear']){
      const entry=value(name);if(entry!==undefined)draft.profile[name]=entry;
    }
  }else for(const m of draft.modules){
    for(const [key,prefix] of [['name','moduleName:'],['code','moduleCode:'],['color','moduleColor:']]){
      const entry=value(prefix+m.id);if(entry!==undefined)m[key]=entry;
    }
  }
}
function setupStudyError(){
  const p=ensureSetupDraft().profile;
  for(const [name,missing,tooLong] of [
    ['name','Enter your name.','Use at most 100 characters for your name.'],
    ['degree','Enter your degree program.','Use at most 120 characters for your degree program.'],
    ['studyMode','Choose your study mode.','Use at most 80 characters for your study mode.']
  ]){
    if(!String(p[name]||'').trim())return [missing,name];
    const max={name:100,degree:120,studyMode:80}[name];
    if(String(p[name]).trim().length>max)return [tooLong,name];
  }
  if(!['Spring semester','Fall semester'].includes(p.semesterTerm))return ['Choose your current semester.','semesterTerm'];
  if(!/^\d{4}$/.test(String(p.semesterYear)))return ['Choose a valid year.','semesterYear'];
  return null;
}
function showSetupError(message,name){setupError=message;renderSetup();focusSetup(name,!!name);return false}
function changeSetupModules(action,id,form){
  if(isSaving)return;captureSetupForm(form);setupError='';
  if(action==='setup-back'){setupStep=1;renderSetup();focusSetup();return}
  if(action==='setup-add-module'){
    const m={id:newId(),name:'',code:'',color:'#6b8fc7'};setupDraft.modules.push(m);renderSetup();focusSetup('moduleName:'+m.id);return;
  }
  if(action==='setup-remove-module'){
    if(state.items.some(item=>item.moduleId===id))return showSetupError('This module is used by existing entries. Keep it during setup; you can reassign its entries later in Profile.','moduleName:'+id);
    setupDraft.modules=setupDraft.modules.filter(m=>m.id!==id);renderSetup();focusSetup();
  }
}
async function submitSetup(form){
  if(!currentUser||!cloudLoaded||isRecovery||isSaving||!needsSetup())return false;
  captureSetupForm(form);setupError='';
  const studyError=setupStudyError();
  if(studyError){setupStep=1;return showSetupError(...studyError)}
  if(setupStep===1){setupStep=2;renderSetup();focusSetup();return true}
  if(!setupDraft.modules.length)return showSetupError('Add at least one module before finishing setup.');
  for(const m of setupDraft.modules){
    if(!String(m.name||'').trim())return showSetupError('Enter a name for each module.','moduleName:'+m.id);
    if(m.name.trim().length>80)return showSetupError('Use at most 80 characters for a module name.','moduleName:'+m.id);
    if(String(m.code||'').trim().length>10)return showSetupError('Use at most 10 characters for a module code.','moduleCode:'+m.id);
    if(!/^#[\da-f]{6}$/i.test(m.color))return showSetupError('Choose a valid module color.','moduleColor:'+m.id);
  }
  const before=JSON.parse(JSON.stringify(state)),epoch=authEpoch,userId=currentUser.id,p=setupDraft.profile;
  state.profile={...state.profile,...p,name:p.name.trim(),degree:p.degree.trim(),studyMode:p.studyMode.trim(),semester:p.semesterTerm+' '+p.semesterYear,setupComplete:true};
  state.modules=setupDraft.modules.map(m=>({...m,name:m.name.trim(),code:String(m.code||'').trim()}));
  try{
    const saving=persist();renderSetup();await saving;
    if(epoch!==authEpoch||currentUser?.id!==userId)return false;
    setupDraft=null;setupError='';setupNotice=true;render();focusSetup();return true;
  }catch(error){
    if(epoch!==authEpoch||currentUser?.id!==userId)return false;
    state=before;
    const message=error?.message?.includes('STUDYFLOW_REVISION_CONFLICT')?'Your account changed on another device. Sign out and sign in again to load the latest entries, then complete setup.':accountMessage(error);
    return showSetupError(message);
  }
}

function cancelPendingAccountDeletion(){
  if(pendingAccountDeletion){pendingAccountDeletion=null;authBusy=false}
}
function accountDeletionError(error){
  if(error?.code==='invalid_credentials')return 'Your password is incorrect. Your account was not deleted.';
  if(error?.message?.includes('STUDYFLOW_RECENT_SIGN_IN_REQUIRED'))return 'Please enter your password again to confirm the deletion.';
  if(error?.message?.includes('STUDYFLOW_ACCOUNT_CONFIRMATION_REQUIRED'))return 'Type your account email address to confirm.';
  if(error?.message?.includes('STUDYFLOW_ACCOUNT_HAS_FILES'))return 'Your account still owns uploaded files. Please contact the administrator before deleting it.';
  if(error?.message?.includes('STUDYFLOW_ACCOUNT_ACCESS_DENIED'))return 'Sign out and sign in again before deleting your account.';
  return accountMessage(error);
}
async function submitAccountDeletion(form){
  if(!currentUser||!cloudLoaded||isRecovery||setupActive()||isSaving||pendingAccountDeletion)return false;
  const emailControl=form.elements.namedItem('confirmationEmail'),passwordControl=form.elements.namedItem('confirmationPassword');
  const email=currentUser.email,confirmation=String(emailControl?.value||'').trim().toLowerCase();
  const password=String(passwordControl?.value||'');
  if(confirmation!==email.toLowerCase())return formError(form,'Type your account email address to confirm.','confirmationEmail');
  if(!password)return formError(form,'Enter your current password to continue.','confirmationPassword');
  const attempt={epoch:authEpoch,userId:currentUser.id,revision:cloudRevision};
  const stillCurrent=()=>attempt.epoch===authEpoch&&currentUser?.id===attempt.userId;
  const fields=form.querySelector('fieldset'),submit=form.querySelector('[type="submit"]');
  pendingAccountDeletion=attempt;authBusy=true;if(fields)fields.disabled=true;if(submit)submit.textContent=t('Deleting your account…');
  passwordControl.value='';
  const errorBox=form.querySelector('.form-error');if(errorBox)errorBox.hidden=true;
  try{
    const {data,error}=await accountClient.auth.signInWithPassword({email,password});
    if(!stillCurrent())return false;
    if(error)throw error;
    if(data?.session?.user?.id!==attempt.userId)throw Error('STUDYFLOW_ACCOUNT_ACCESS_DENIED');
    const result=await accountClient.rpc('studyflow_delete_account',{confirmation_email:confirmation,expected_revision:attempt.revision});
    if(!stillCurrent())return false;
    if(result.error)throw result.error;
    if(result.data?.deleted!==true)throw Error('Account deletion did not complete');
    let signOutFailed=false;
    try{const logout=await accountClient.auth.signOut({scope:'local'});signOutFailed=!!logout?.error}catch{signOutFailed=true}
    if(currentUser&&currentUser.id!==attempt.userId)return true;
    // The server has already removed every session. Also discard the local token if logout was offline.
    if(signOutFailed){try{globalThis.localStorage?.removeItem(ACCOUNT_STORAGE_KEY)}catch{}}
    clearAccount('Your account has been deleted.');
    return true;
  }catch(error){
    if(stillCurrent())return formError(form,accountDeletionError(error));
    return false;
  }finally{
    if(pendingAccountDeletion===attempt){pendingAccountDeletion=null;authBusy=false;if(fields)fields.disabled=false;if(submit)submit.textContent=t('Delete my account permanently')}
  }
}

app.addEventListener('change',async e=>{if(e.target.matches?.('[data-language]')){await changeLanguage(e.target.value,e.target);return}if(!currentUser||!cloudLoaded||isSaving||setupActive())return;const el=e.target;if(el.id==='task-type'||el.id==='task-group'){syncTaskGroup();return}else if(el.id==='entry-module'){el.closest('.module-field').style.setProperty('--module',color(moduleFor(el.value)))}else if(el.dataset.moduleColor||el.dataset.moduleName||el.dataset.moduleCode){const before=JSON.parse(JSON.stringify(state));try{if(el.dataset.moduleColor)moduleFor(el.dataset.moduleColor).color=el.value;else if(el.dataset.moduleName)moduleFor(el.dataset.moduleName).name=el.value.trim()||t('New module');else moduleFor(el.dataset.moduleCode).code=el.value.trim();await persist()}catch(error){state=before;render();toast(accountMessage(error))}}});
app.addEventListener('input',e=>{if(!currentUser||!cloudLoaded||setupActive())return;if(e.target.id==='list-search'){filter=e.target.value;const kind=route==='tasks'?'task':route==='exams'?'exam':'group';const list=visibleItems().filter(x=>x.kind===kind&&(x.title+' '+x.description+' '+moduleFor(x.moduleId).name).toLowerCase().includes(filter.toLowerCase()));document.getElementById('item-list').innerHTML=sorted(list).map(card).join('')||`<div class="empty">${tx("No matching entries.")}</div>`}});
function formError(form,message,name){const box=form.querySelector('.form-error');box.textContent=t(message);box.hidden=false;const control=name?form.elements.namedItem(name):null;if(control){control.setAttribute('aria-invalid','true');control.focus({preventScroll:true});control.scrollIntoView?.({block:'center'})}else box.scrollIntoView?.({block:'nearest'});return false}
async function saveForm(form){
  if(!form||!currentUser||!cloudLoaded||isSaving||setupActive())return false;
  const before=JSON.parse(JSON.stringify(state)),data={};
  for(const el of form.elements)if(el.name&&!el.disabled&&el.type!=='checkbox')data[el.name]=el.value;
  form.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));
  try{
    if(form.getAttribute('id')==='entry-form'){
      const description=String(data.description||'').trim(),title=String(data.title||'').trim()||description.split(/\r?\n/)[0].slice(0,140);
      if(!title)return formError(form,'Enter a task title or write a description first.','description');
      const selectedGroup=data.kind==='task'&&data.workType==='group'?state.items.find(g=>g.kind==='group'&&g.id===data.groupId):null;
      if(data.kind==='task'&&data.workType==='group'&&!selectedGroup)return formError(form,'Choose a group. Create one under Groups first.','groupId');
      if(selectedGroup?.moduleId)data.moduleId=selectedGroup.moduleId;
      if(!selectedGroup)data.groupId='';
      data.moduleId=String(data.moduleId||'');
      const ownModule=state.modules.find(m=>m.id===data.moduleId);
      if(!ownModule&&!selectedGroup?.moduleId&&!(data.kind==='group'&&!data.moduleId))return formError(form,'Choose a module.','moduleId');
      if(data.kind!=='group'&&(!data.due||Number.isNaN(new Date(data.due).getTime())||!form.elements.namedItem('due')?.validity.valid))return formError(form,'Choose a valid date and time.','due');
      if(data.kind==='exam'&&(!data.duration||Number(data.duration)<1||Number(data.duration)>600))return formError(form,'Enter a duration between 1 and 600 minutes.','duration');
      const existing=state.items.find(x=>x.id===data.entryId);
      let item={...existing,...data,id:data.entryId||newId(),title,description,done:existing?.done||false,ownerId:existing?.ownerId||state.activeUser};
      if(existing&&!canManage(existing))return formError(form,'Only the organizer can edit this group.');
      if(item.kind==='group'){
        item=unscheduledGroup(item);item.memberIds=personIds(data.members||'');item.moduleSnapshot=item.moduleId?moduleFor(item.moduleId):null;
        item.members=item.memberIds.map(userName).join(', ');delete item.responses;
      }else if(item.kind==='task'&&selectedGroup){
        item.moduleSnapshot=selectedGroup.moduleId?(selectedGroup.moduleSnapshot||moduleFor(selectedGroup.moduleId)):ownModule;
      }else if(item.kind==='task'){
        item.groupId='';delete item.moduleSnapshot;
      }
      if(existing)state.items=state.items.map(x=>x.id===item.id?item:x);else state.items.push(item);
      if(item.kind==='group'&&item.moduleId)for(const task of state.items)if(task.kind==='task'&&task.groupId===item.id){task.moduleId=item.moduleId;task.moduleSnapshot=item.moduleSnapshot}
      await persist();overlay=null;route=item.kind==='task'?'tasks':item.kind==='exam'?'exams':'groups';filter='';render();
      toast(existing?'Changes saved':item.kind==='group'?t('Group created · {members}',{members:countText('{count} member','{count} members',item.memberIds.length+1)}):'Entry created');return true;
    }
    if(form.getAttribute('id')==='profile-form'){
      if(!String(data.name||'').trim())return formError(form,'Enter your name.','name');
      state.profile={...state.profile,name:data.name.trim(),degree:data.degree,studyMode:data.studyMode,semesterTerm:data.semesterTerm,semesterYear:data.semesterYear,semester:data.semesterTerm+' '+data.semesterYear};
      await persist();overlay=null;render();toast('Profile saved');return true;
    }
  }catch(error){state=before;return formError(form,error.message==='MEMBER_EMAIL_REQUIRED'?'Enter each member’s email address, separated by commas.':accountMessage(error))}
  return formError(form,'This form could not be saved. Please reopen the entry form.');
}
app.addEventListener('submit',async e=>{e.preventDefault();if(e.target.getAttribute('id')==='account-form')await submitAccount(e.target);else if(e.target.getAttribute('id')==='setup-form')await submitSetup(e.target);else if(e.target.getAttribute('id')==='delete-account-form')await submitAccountDeletion(e.target);else await saveForm(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});
const shownReminders=new Set();function checkReminders(){if(!currentUser||!cloudLoaded||setupActive())return;const now=Date.now();for(const item of visibleItems()){if(item.kind==='group'||item.done||item.reminder==='none')continue;const at=new Date(item.due).getTime()-Number(item.reminder)*60000,key=state.activeUser+':'+item.id+':'+item.due+':'+item.reminder;if(now>=at&&now<at+60000&&!shownReminders.has(key)){shownReminders.add(key);toast(t('Reminder: {title} · {date}',{title:item.title,date:dateText(item.due)}))}}}
setInterval(checkReminders,30000);initializeAccounts();
</script></body></html>
