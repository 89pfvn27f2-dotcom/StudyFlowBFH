ule-row button{color:var(--muted);padding:3px}.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.theme{border:1px solid var(--border);border-radius:12px;padding:12px;text-align:left;display:flex;align-items:center;gap:8px;font-size:12px}.theme.selected{border:1.5px solid var(--primary)}.theme .swatch{width:24px;height:22px;border-radius:6px;display:inline-block}.switch{width:36px;height:22px;border-radius:20px;background:#ccd4ce;padding:3px}.switch span{display:block;width:16px;height:16px;background:#fff;border-radius:50%}.switch.on{background:var(--primary)}.switch.on span{margin-left:14px}.overlay{position:absolute;inset:0;z-index:20;background:#0d211a66;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-height:calc(100% - 48px);overflow:auto;overscroll-behavior:contain;padding:20px 18px max(28px,env(safe-area-inset-bottom));box-shadow:0 -10px 40px #0002}.sheet-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.sheet-header h2{font-size:22px}.close{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center}.field{margin:17px 0}.field>label,.field-label{display:block;font-size:12px;font-weight:700;margin-bottom:8px}.field input,.field textarea,.field select{display:block;width:100%;border:1px solid var(--border);border-radius:12px;background:var(--white);color:var(--text);padding:12px;font-size:14px;line-height:1.5;min-height:46px}.field textarea{min-height:100px;resize:vertical}.field input[type=datetime-local]{min-width:0;max-width:100%;appearance:none}.help{font-size:11px;color:var(--muted);line-height:1.5;margin:7px 0 0}.module-field{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--module,var(--border));border-left:5px solid var(--module,var(--primary));border-radius:12px;padding-left:11px}.module-field select{border:0;background:transparent;padding-left:0;border-radius:12px}.module-field .dot{width:11px;height:11px}.two-columns{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two-columns .field{margin:0}.action{width:100%;border-radius:13px;padding:14px 16px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;min-height:48px;margin:7px 0}.action.secondary{background:var(--soft);color:var(--primary)}.action.danger{background:var(--white);border:1px solid var(--border);color:var(--text)}.multiline{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.7}.detail-label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:21px 0 7px;font-weight:700}.toast{position:absolute;z-index:100;left:16px;right:16px;bottom:108px;border-radius:13px;background:var(--primary);color:#fff;padding:14px;font-size:12px;box-shadow:0 5px 30px #0003}.notice{background:var(--soft);color:var(--primary);padding:12px;border-radius:12px;font-size:12px;line-height:1.5;margin-bottom:16px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{background:var(--soft);color:var(--primary);padding:7px 10px;border-radius:8px;font-size:11px}.search{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--white);margin:0 0 8px;color:var(--text)}.mono .swatch,.mono input[type=color]{filter:grayscale(1)}.reminder-banner{border:1px solid var(--primary);border-radius:12px;padding:12px;font-size:12px;background:var(--soft);margin-bottom:16px}dialog{border:0} @media(max-height:700px){.header{padding-top:max(20px,env(safe-area-inset-top))}.sheet{max-height:calc(100% - 20px)}}
.demo-bar{flex:none;background:var(--soft);border-bottom:1px solid var(--border);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px}.demo-bar small{display:block;font-size:10px;color:var(--muted);margin-top:2px}.demo-bar select{max-width:155px;min-width:0;padding:7px;border:1px solid var(--border);border-radius:9px;background:var(--white);color:var(--text);font-size:12px}.member-picker{border:0;padding:0;margin:17px 0;min-width:0}.member-picker legend{font-size:12px;font-weight:700;margin-bottom:8px}.member-option{display:flex;align-items:center;gap:10px;background:var(--white);padding:12px;border:1px solid var(--border);border-radius:12px;margin-bottom:7px;font-size:13px}.member-option input{width:18px;height:18px;accent-color:var(--primary)}.member-option small{margin-left:auto;color:var(--muted);font-size:10px}.invite-card{border:1px solid var(--primary);border-radius:16px;background:var(--white);padding:16px;margin:12px 0}.invite-card h3{margin:8px 0}.invite-actions{display:flex;gap:8px;margin-top:12px}.invite-actions .action{margin:0;font-size:12px;min-height:40px;padding:10px}.status-pill{font-size:10px;border-radius:7px;padding:5px 8px;background:var(--soft);color:var(--primary)}.group-status{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}.field input[type=checkbox]{width:18px;min-height:18px} </style></head><body><div id="app" class="phone"></div>
<script>
const STORAGE_KEY='studyflow-live-v1';
function newId(){if(typeof globalThis.crypto?.randomUUID==='function')return globalThis.crypto.randomUUID();return 'entry-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
const palette={Green:['#174d3e','#dff46e','#f1f3ee','#e9f0e8'],Blue:['#245b87','#b9e4ff','#f1f6fa','#e8f0f6'],Red:['#8c3540','#ffc9bd','#faf2f3','#f4e8eb'],Orange:['#a65319','#ffd38b','#fbf5ed','#f6ebdf'],Pink:['#963e6a','#ffd0e4','#fbf2f7','#f6e8f0'],Lilac:['#6752a3','#e2d5ff','#f6f3fa','#eee8f6']};
const paths={home:'M3 10 12 3l9 7M5 9v12h14V9M9 21v-7h6v7',tasks:'M9 6h12M9 12h12M9 18h12M3 5l1 1 2-2M3 11l1 1 2-2M3 17l1 1 2-2',exams:'m2 9 10-5 10 5-10 5-10-5M6 11v6c3 3 9 3 12 0v-6M22 9v8',groups:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M16 4a4 4 0 0 1 0 8M22 21v-2a4 4 0 0 0-3-3.9M13 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',profile:'M20 21v-2a8 8 0 0 0-16 0v2M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0',plus:'M12 5v14M5 12h14',close:'m6 6 12 12M6 18 18 6',check:'m5 12 4 4L19 6',left:'m15 18-6-6 6-6',right:'m9 18 6-6-6-6'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.tasks}"/></svg>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
const today=localDate(new Date());const future=n=>{let d=new Date();d.setDate(d.getDate()+n);return localDate(d)};
const seed={version:1,profile:{name:'Lea Müller',degree:'BSc Agricultural Science',semester:'Spring semester 2025',studyMode:'Full-time',semesterTerm:'Spring semester',semesterYear:'2025'},theme:'Green',mono:false,modules:[{id:'m1',name:'Statistik II',code:'ST',color:'#6b8fc7'},{id:'m2',name:'Projektmanagement',code:'PM',color:'#a27aca'},{id:'m3',name:'Medien & Gesellschaft',code:'MG',color:'#e5a35c'}],items:[{id:'demo-task',kind:'task',title:'Summarize chapter 4',description:'Read chapter 4 and write a summary of the key statistical methods.',moduleId:'m1',due:today+'T18:00',reminder:'30',notes:'Include one worked example for each method.',priority:'Normal',done:false},{id:'demo-group',kind:'group',title:'Interim presentation',description:'Review the slides and agree on the speaking parts.',moduleId:'m2',due:today+'T16:30',reminder:'30',notes:'Bring the latest presentation.',members:'Lea, Anna, Noah',location:'Room 2.14',done:false},{id:'demo-exam',kind:'exam',title:'Statistics II',description:'Final written assessment.',moduleId:'m1',due:future(6)+'T14:00',reminder:'1440',notes:'',duration:'90',location:'H207 seminar room, 2nd floor',examType:'On computer',materials:'1 × A4 cheat-sheet, double-sided. Study USB drive required.',done:false}]};
let storageOk=true;let state;try{state=JSON.parse(localStorage.getItem(STORAGE_KEY))||JSON.parse(JSON.stringify(seed));if(!Array.isArray(state.items)||!Array.isArray(state.modules))state=JSON.parse(JSON.stringify(seed))}catch{state=JSON.parse(JSON.stringify(seed));storageOk=false}
state.profile={studyMode:'Full-time',semesterTerm:(state.profile.semester||'').startsWith('Spring')?'Spring semester':'Fall semester',semesterYear:(state.profile.semester||'').match(/\d{4}/)?.[0]||String(new Date().getFullYear()),...state.profile};
state.activeUser='lea';
state.people||=[{id:'anna',name:'Anna Keller'},{id:'noah',name:'Noah Meier'},{id:'mia',name:'Mia Schmid'}];
function userName(id){return id==='lea'?state.profile.name:state.people.find(p=>p.id===id)?.name||'Member'}
function personIds(names){const unique=[...new Set(names.split(/[,;\n]/).map(n=>n.trim()).filter(Boolean))];return unique.filter(n=>![state.profile.name.toLowerCase(),state.profile.name.split(' ')[0].toLowerCase()].includes(n.toLowerCase())).map(name=>{let p=state.people.find(p=>p.name.toLowerCase()===name.toLowerCase()||p.name.split(' ')[0].toLowerCase()===name.toLowerCase());if(!p){p={id:newId(),name};state.people.push(p)}return p.id}).filter((id,i,ids)=>ids.indexOf(id)===i)}
for(const item of state.items){item.ownerId='lea';if(item.kind==='group'){item.memberIds||=personIds(item.members||'');item.members=(item.memberIds||[]).map(userName).join(', ');delete item.responses}}
function visibleItems(){return state.items}
function canManage(){return true}
function groupFor(item){return state.items.find(g=>g.kind==='group'&&g.id===item.groupId)}
function memberTasks(id){return state.items.filter(t=>t.kind==='task'&&t.workType==='group'&&groupFor(t)?.memberIds?.includes(id))}
function memberPicker(item){return input('Group members','members',(item.memberIds||[]).map(userName).join(', '),'text','placeholder="Anna Keller, Noah Meier"')+'<p class="help">Separate names with commas. You are included automatically.</p>'}
function memberStatus(item){return `<p class="detail-label">Group members</p><div class="group-status"><span>${esc(state.profile.name)}</span><span class="status-pill">You</span></div>${(item.memberIds||[]).map(id=>`<button class="setting" data-action="member-profile" data-member="${esc(id)}" data-group="${esc(item.id)}"><span><strong>${esc(userName(id))}</strong><small>${memberTasks(id).length} shared task(s) · View profile</small></span>${icon('right')}</button>`).join('')}`}
function taskGroupFields(item){const groups=state.items.filter(x=>x.kind==='group');return `${field('Task type',`<select name="workType" id="task-type">${selectOptions([['individual','Individual task'],['group','Group work']],item.workType||'individual')}</select>`)}<div id="task-group-field" ${item.workType==='group'?'':'hidden'}>${field('Group',`<select name="groupId" id="task-group"><option value="">Choose a group</option>${groups.map(g=>`<option value="${esc(g.id)}" ${g.id===item.groupId?'selected':''}>${esc(g.title)}</option>`).join('')}</select>`,groups.length?'This task also appears in every group member’s profile.':'Create a group under Groups first.')}</div>`}
function syncTaskGroup(){const type=document.getElementById('task-type');if(!type)return;const shared=type.value==='group',select=document.getElementById('task-group'),group=state.items.find(g=>g.kind==='group'&&g.id===select.value),module=document.getElementById('entry-module');document.getElementById('task-group-field').hidden=!shared;module.disabled=shared&&!!group;if(shared&&group)module.value=group.moduleId;module.closest('.module-field').style.setProperty('--module',color(moduleFor(module.value)))}
function groupTaskList(group){const tasks=state.items.filter(t=>t.kind==='task'&&t.workType==='group'&&t.groupId===group.id);return `<p class="detail-label">Group tasks</p>${tasks.map(card).join('')||'<p class="help">No tasks yet. In Tasks, select Group work and choose this group.</p>'}`}
function memberProfile(id,groupId){const tasks=memberTasks(id);return `<div class="sheet-header"><h2>${esc(userName(id))}</h2><button class="close" data-action="close" aria-label="Close member profile">${icon('close')}</button></div><p class="notice">Member profile preview · shared group tasks are added here automatically. This prototype is operated by one person.</p><h3>Tasks · ${tasks.length}</h3>${sorted(tasks).map(card).join('')||'<p class="empty">No group tasks assigned yet.</p>'}<button class="action secondary" data-action="detail" data-id="${esc(groupId)}">Back to group</button>`}
let route='home' ,profileTab='',overlay=null,filter='',calendarOffset=0,selectedDay=null;const calendarBase=new Date(new Date().getFullYear(),new Date().getMonth(),1);const app=document.getElementById('app');let toastTimer;
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOk=true}catch{storageOk=false}}
function moduleFor(id){return state.modules.find(m=>m.id===id)||{id:'',name:'No module',code:'',color:'#77827d'}}
function gray(h){const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16),v=Math.round(.2126*r+.7152*g+.0722*b).toString(16).padStart(2,'0');return '#'+v+v+v}
function color(m){return state.mono?gray(m.color):m.color}
function dateText(value){if(!value)return 'No date';const d=new Date(value);return Number.isNaN(d.getTime())?'No date':d.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function reminderText(item){if(item.reminder==='none')return 'No reminder';const ms=new Date(item.due).getTime()-Number(item.reminder)*60000;return dateText(new Date(ms).toISOString())}
function applyTheme(){const p=state.mono?['#303030','#dedede','#f4f4f4','#e8e8e8']:palette[state.theme]||palette.Green;['primary','accent','bg','soft'].forEach((k,i)=>app.style.setProperty('--'+k,p[i]));app.style.setProperty('--text',state.mono?'#202020':'#172b25');app.style.setProperty('--muted',state.mono?'#777777':'#728078');app.style.setProperty('--border',state.mono?'#e2e2e2':'#e1e7e1');app.classList.toggle('mono',state.mono)}
function toast(msg){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;app.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3500)}
function nav(){return `<nav class="nav" aria-label="Main navigation">${[['home','Home'],['tasks','Tasks'],['exams','Exams'],['groups','Groups'],['profile','Profile']].map(([key,label])=>`<button data-action="route" data-route="${key}" class="${route===key?'active':''}" ${route===key?'aria-current="page"':''}>${icon(key)}<span>${label}</span></button>`).join('')}</nav>`}
function card(item){const m=moduleFor(item.moduleId);return `<article class="card ${item.done?'completed':''}" style="--module:${esc(color(m))}"><div class="card-main">${item.kind!=='exam'&&canManage(item)?`<button class="check ${item.done?'done':''}" data-action="toggle" data-id="${esc(item.id)}" aria-label="${item.done?'Reopen':'Complete'} ${esc(item.title)}">${item.done?icon('check'):''}</button>`:''}<button class="card-open" data-action="detail" data-id="${esc(item.id)}"><span class="module-tag"><i class="dot"></i>${esc(m.name)}</span><h3>${esc(item.title)}</h3>${item.kind==='task'&&groupFor(item)?`<p class="meta">Group work · ${esc(groupFor(item).title)}</p>`:''}<p class="meta">${esc(dateText(item.due))}${item.kind==='task'?' · '+esc(item.priority):''}</p>${item.description?`<p class="meta">${esc(item.description.slice(0,100))}${item.description.length>100?'…':''}</p>`:''}</button></div></article>`}
function sorted(items){return [...items].sort((a,b)=>Number(a.done)-Number(b.done)||new Date(a.due)-new Date(b.due))}
function calendar(){const date=new Date(calendarBase.getFullYear(),calendarBase.getMonth()+calendarOffset,1),year=date.getFullYear(),month=date.getMonth();const start=new Date(year,month,1-(date.getDay()+6)%7);let days='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=localDate(d),events=visibleItems().filter(x=>x.due?.slice(0,10)===key);days+=`<button class="day ${d.getMonth()!==month?'outside':''} ${key===today?'today':''}" data-action="day" data-date="${key}" aria-label="${esc(d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}))}, ${events.length} events">${d.getDate()}<span class="dots">${events.slice(0,3).map(e=>`<i style="background:${esc(color(moduleFor(e.moduleId)))}"></i>`).join('')}</span></button>`}return `<div class="panel calendar"><div class="row"><span class="month">${date.toLocaleDateString('en-GB',{month:'long',year:'numeric'})}</span><div class="calendar-controls"><button class="icon-button" data-action="month" data-step="-1" aria-label="Previous month" ${calendarOffset===-6?'disabled':''}>${icon('left')}</button><button class="today-button" data-action="today">Today</button><button class="icon-button" data-action="month" data-step="1" aria-label="Next month" ${calendarOffset===6?'disabled':''}>${icon('right')}</button></div></div><div class="week">${['MON','TUE','WED','THU','FRI','SAT','SUN'].map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${days}</div></div>`}
function home(){const tasks=visibleItems().filter(x=>x.kind!=='exam'&&x.due?.slice(0,10)===today),done=tasks.filter(x=>x.done).length,pct=tasks.length?Math.round(done/tasks.length*100):0;return `<p class="eyebrow">${esc(new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))}</p><h1>Hello ${esc(userName(state.activeUser).split(' ')[0])}, ready for today?</h1><div class="hero"><p class="eyebrow">✧ Your daily goal</p><h2>${tasks.length&&done===tasks.length?'All done. Great work!':"You're in a great flow."}</h2><p>${tasks.length-done} tasks left today.</p><div class="row"><strong>${pct}%</strong><span style="font-size:10px;opacity:.7">completed</span></div><div class="progress"><span style="width:${pct}%"></span></div></div><p class="eyebrow">Your schedule</p><h2>Calendar</h2><p class="subtitle" style="margin:8px 0 16px">Deadlines, exams, and important university dates.</p>${calendar()}<section class="section"><div class="row"><h2>Today</h2><button class="text-button" data-action="route" data-route="tasks">Show all</button></div>${sorted(visibleItems().filter(x=>x.due?.slice(0,10)===today)).map(card).join('')||'<div class="empty">No items planned for today.</div>'}</section>`}
function overview(kind){const labels={task:['YOUR TO-DOS','Tasks','All your tasks and deadlines at a glance.'],exam:['YOUR EXAMS','Exam overview','Exam details and permitted materials in one place.'],group:['YOUR GROUP WORK','Groups','Your groups, members, and shared tasks.']}[kind];const items=visibleItems().filter(x=>x.kind===kind&&(!filter||(x.title+' '+x.description+' '+moduleFor(x.moduleId).name).toLowerCase().includes(filter.toLowerCase())));return `<p class="eyebrow">${labels[0]}</p><h1>${labels[1]}</h1><p class="subtitle">${labels[2]}</p><div class="row"><span class="count">${items.filter(x=>!x.done).length} open</span><button class="plus" data-action="add" data-kind="${kind}" aria-label="Add ${kind}">${icon('plus')}</button></div><input type="search" class="search" id="list-search" placeholder="Search ${kind==='group'?'groups':kind+'s'}" aria-label="Search" value="${esc(filter)}"><div id="item-list">${sorted(items).map(card).join('')||`<div class="empty">No ${kind==='group'?'groups':kind+'s'} found. Use + to create one.</div>`}</div>`}
function profile(){if(profileTab==='modules')return moduleSettings();if(profileTab==='appearance')return appearance();return `<p class="eyebrow">Your account</p><h1>Profile & reminders</h1><p class="subtitle">Personalize how StudyFlow supports you.</p>${!storageOk?'<div class="notice">Your browser is blocking local storage. Changes are kept for this session only.</div>':''}<div class="panel"><h2>${esc(state.profile.name)}</h2><p class="subtitle" style="margin:6px 0 12px">${esc(state.profile.degree)} · ${esc(state.profile.studyMode)} · ${esc(state.profile.semester)}</p><button class="setting" data-action="profile-edit"><span><strong>Your profile</strong><small>Name, degree program, study mode, and semester</small></span>${icon('right')}</button><button class="setting" data-action="profile-tab" data-tab="modules"><span><strong>Studies & modules</strong><small>${state.modules.length} modules · names and colors</small></span>${icon('right')}</button><button class="setting" data-action="profile-tab" data-tab="appearance"><span><strong>Appearance</strong><small>${esc(state.theme)}${state.mono?' · Monochrome':''}</small></span>${icon('right')}</button></div><p class="help" style="margin-top:18px">Your entries are saved in this browser. Reminders appear here while StudyFlow is open.</p>`}
function moduleSettings(){return `<button class="text-button" data-action="profile-tab" data-tab="">‹ Back to profile</button><h1 style="margin-top:18px">Studies & modules</h1><p class="subtitle">Module names and colors apply to all your entries.</p><div class="panel">${state.modules.map(m=>`<div class="module-row" data-module="${esc(m.id)}"><input type="color" aria-label="Color for ${esc(m.name)}" data-module-color="${esc(m.id)}" value="${esc(m.color)}"><input type="text" aria-label="Module name" data-module-name="${esc(m.id)}" value="${esc(m.name)}" maxlength="80"><input type="text" class="code" aria-label="Module code" data-module-code="${esc(m.id)}" value="${esc(m.code)}" maxlength="10"><button data-action="remove-module" data-id="${esc(m.id)}" aria-label="Remove ${esc(m.name)}">${icon('close')}</button></div>`).join('')}<button class="action secondary" data-action="add-module">+ Add module</button></div><button class="action" data-action="save-modules">Save modules</button>`}
function appearance(){return `<button class="text-button" data-action="profile-tab" data-tab="">‹ Back to profile</button><h1 style="margin-top:18px">Appearance</h1><p class="subtitle">Choose colors that match the way you work.</p><div class="panel"><button class="setting" data-action="mono" aria-pressed="${state.mono}"><span><strong>Monochrome mode</strong><small>Reduce colors and distractions</small></span><span class="switch ${state.mono?'on':''}"><span></span></span></button><div class="themes" style="margin-top:18px">${Object.entries(palette).map(([name,p])=>`<button class="theme ${name===state.theme?'selected':''}" data-action="theme" data-theme="${name}" aria-pressed="${name===state.theme}"><i class="swatch" style="background:linear-gradient(90deg,${p[0]} 50%,${p[1]} 50%)"></i>${name}${name===state.theme?' ✓':''}</button>`).join('')}</div></div>`}
function render(){const scroll=document.querySelector('.content')?.scrollTop||0;applyTheme();app.innerHTML=`<header class="header"><div class="brand"><span class="logo">S</span><span>StudyFlow</span></div><span class="bfh">BFH</span></header><main class="content" id="main">${route==='home'?home():route==='tasks'?overview('task'):route==='exams'?overview('exam'):route==='groups'?overview('group'):profile()}</main>${nav()}`;document.querySelector('.content').scrollTop=scroll;if(overlay)renderOverlay();checkReminders()}
const reminderOptions=[['none','No reminder'],['0','At the due time'],['15','15 minutes before'],['30','30 minutes before'],['60','1 hour before'],['1440','1 day before'],['2880','2 days before']];
function selectOptions(arr,current){return arr.map(([value,label])=>`<option value="${esc(value)}" ${String(current)===value?'selected':''}>${esc(label)}</option>`).join('')}
function profileOptions(values,current){return selectOptions([...new Set([current,...values].filter(Boolean))].map(x=>[x,x]),current)}
function field(label,body,help=''){return `<div class="field"><label>${label}${body}</label>${help?`<p class="help">${help}</p>`:''}</div>`}
function input(label,name,value,type='text',extra=''){return field(label,`<input type="${type}" name="${name}" value="${esc(value)}" ${extra}>`)}
function textarea(label,name,value,placeholder,cls=''){return field(label,`<textarea name="${name}" class="${cls}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`)}
function formMarkup(item){const kind=item.kind,m=moduleFor(item.moduleId),heading=(item.id?'Edit ':'Add ')+(kind==='group'?'group':kind);return `<div class="sheet-header"><h2>${heading}</h2><button class="close" data-action="close" aria-label="Close form">${icon('close')}</button></div><form id="entry-form" novalidate><input type="hidden" name="kind" value="${kind}"><input type="hidden" name="entryId" value="${esc(item.id||'')}">${input(kind==='task'?'Task title (optional)':kind==='group'?'Group name':'Exam title','title',item.title||'','text','maxlength="140" placeholder="Title, or leave blank and describe below"')}${textarea('Description','description',item.description||'',kind==='task'?'What is this task about? Write your own description.':'What is this about?')}${kind==='task'?taskGroupFields(item):''}${field('Module',`<div class="module-field" style="--module:${esc(color(m))}"><span class="dot"></span><select name="moduleId" id="entry-module" required aria-label="Module">${state.modules.map(x=>`<option value="${esc(x.id)}" ${item.moduleId===x.id?'selected':''}>${esc(x.name)}${x.code?' · '+esc(x.code):''}</option>`).join('')}</select></div>`,'The color comes from Profile → Studies & modules.')}${input(kind==='exam'?'Exam date & time':'Due date & time','due',item.due||today+'T18:00','datetime-local','required')}${field('Reminder',`<select name="reminder" aria-label="Reminder">${selectOptions(reminderOptions,item.reminder??'30')}</select>`,'Shown in StudyFlow while the app is open.')}${kind==='task'?field('Priority',`<select name="priority" aria-label="Priority">${selectOptions(['High','Normal','Low'].map(x=>[x,x]),item.priority||'Normal')}</select>`):''}${kind==='group'?memberPicker(item):''}${kind==='exam'?input('Location','location',item.location||'','text','placeholder="Room or meeting link"'):''}${kind==='exam'?`<div class="two-columns">${input('Duration (minutes)','duration',item.duration||90,'number','min="1" max="600" required')}${field('Exam type',`<select name="examType">${selectOptions(['On computer','On paper','Oral','Other'].map(x=>[x,x]),item.examType||'On computer')}</select>`)}</div>${textarea('Permitted materials','materials',item.materials||'','Open book, cheat-sheet, calculator, platform…')}`:''}<p class="form-error notice" role="alert" hidden></p><button class="action" type="button" data-action="save-form">${item.id?'Save changes':'Create '+(kind==='group'?'group':kind)}</button><button class="action secondary" type="button" data-action="close">Cancel</button></form>`}
function detailMarkup(item){const m=moduleFor(item.moduleId);return `<div class="sheet-header"><h2>${item.kind==='group'?'Group':'Entry'} details</h2><button class="close" data-action="close" aria-label="Close details">${icon('close')}</button></div><span class="module-tag" style="--module:${esc(color(m))}"><i class="dot"></i>${esc(m.name)}</span><h1>${esc(item.title)}</h1>${item.description?`<p class="multiline">${esc(item.description)}</p>`:''}<p class="detail-label">${item.kind==='task'?'Due date':'Date & time'}</p><p>${esc(dateText(item.due))}</p><p class="detail-label">Reminder</p><p>${esc(reminderText(item))}</p>${item.priority?`<p class="detail-label">Priority</p><p>${esc(item.priority)}</p>`:''}${item.kind==='group'?memberStatus(item)+groupTaskList(item):''}${item.kind==='task'&&groupFor(item)?`<p class="detail-label">Group work</p><button class="text-button" data-action="detail" data-id="${esc(groupFor(item).id)}">${esc(groupFor(item).title)} · ${groupFor(item).memberIds.length+1} members</button>`:''}${item.location?`<p class="detail-label">Location</p><p class="multiline">${esc(item.location)}</p>`:''}${item.duration?`<p class="detail-label">Duration & type</p><p>${esc(item.duration)} minutes · ${esc(item.examType)}</p>`:''}${item.materials?`<p class="detail-label">Permitted materials</p><p class="multiline">${esc(item.materials)}</p>`:''}${canManage(item)?`<button class="action" data-action="edit" data-id="${esc(item.id)}">Edit details</button>`:`<p class="help">Shared entry · changes by ${esc(userName(item.ownerId))} update your calendar automatically.</p>`}${item.kind!=='exam'&&canManage(item)?`<button class="action secondary" data-action="toggle" data-id="${esc(item.id)}">${item.done?'Reopen':'Mark completed'}</button>`:''}${canManage(item)?`<button class="action danger" data-action="delete-ask" data-id="${esc(item.id)}">Delete entry</button>`:''}`}
function renderOverlay(){document.querySelector('.overlay')?.remove();if(!overlay)return;let html='';if(overlay.type==='form')html=formMarkup(overlay.item);else if(overlay.type==='member')html=memberProfile(overlay.memberId,overlay.groupId);else if(overlay.type==='detail'){const item=state.items.find(x=>x.id===overlay.id);if(!item){overlay=null;return}html=detailMarkup(item)}else if(overlay.type==='delete'){const item=state.items.find(x=>x.id===overlay.id);html=`<div class="sheet-header"><h2>Delete entry?</h2><button class="close" data-action="close" aria-label="Cancel">${icon('close')}</button></div><p>Delete “${esc(item?.title)}”?</p><button class="action" data-action="delete" data-id="${esc(overlay.id)}">Delete entry</button><button class="action secondary" data-action="detail" data-id="${esc(overlay.id)}">Keep entry</button>`}else if(overlay.type==='day'){const list=visibleItems().filter(x=>x.due?.slice(0,10)===overlay.date);html=`<div class="sheet-header"><h2>${esc(new Date(overlay.date+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}))}</h2><button class="close" data-action="close" aria-label="Close day">${icon('close')}</button></div>${sorted(list).map(card).join('')||'<div class="empty">No scheduled entries.</div>'}<button class="action" data-action="add" data-kind="task" data-date="${esc(overlay.date)}">+ Add task for this day</button>`}else if(overlay.type==='profile'){html=`<div class="sheet-header"><h2>Your profile</h2><button class="close" data-action="close" aria-label="Close">${icon('close')}</button></div><form id="profile-form" novalidate>${input('Name','name',state.profile.name,'text','required')}${field('Degree program',`<select name="degree" required>${profileOptions(['BSc Agricultural Science','BSc Business Administration','BSc Business Information Technology','BSc Architecture','BSc Civil Engineering','BSc Social Work'],state.profile.degree)}</select>`)}${field('Study mode',`<select name="studyMode" required>${selectOptions([['Full-time','Full-time'],['Part-time','Part-time']],state.profile.studyMode)}</select>`)}<div class="two-columns">${field('Current semester',`<select name="semesterTerm" required>${selectOptions([['Spring semester','Spring semester'],['Fall semester','Fall semester']],state.profile.semesterTerm)}</select>`)}${field('Year',`<select name="semesterYear" required>${profileOptions(Array.from({length:13},(_,i)=>String(new Date().getFullYear()-5+i)),state.profile.semesterYear)}</select>`)}</div><p class="form-error notice" role="alert" hidden></p><button class="action" type="button" data-action="save-form">Save profile</button></form>`}const backdrop=document.createElement('div');backdrop.className='overlay';backdrop.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${overlay.type==='form'?'Entry form':'Details'}">${html}</section>`;backdrop.addEventListener('click',e=>{if(e.target===backdrop)closeOverlay()});app.appendChild(backdrop);syncTaskGroup();const first=backdrop.querySelector('input:not([type=hidden]),textarea,button');setTimeout(()=>first?.focus({preventScroll:true}),0)}
function closeOverlay(){overlay=null;document.querySelector('.overlay')?.remove()}
function newEntry(kind,date){if(!state.modules.length){toast('Add a module in Profile first.');route='profile';profileTab='modules';render();return}overlay={type:'form',item:{kind,moduleId:state.modules[0].id,due:(date||today)+'T18:00',reminder:'30'}};renderOverlay()}
app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action,id=b.dataset.id;if(a==='member-profile'){overlay={type:'member',memberId:b.dataset.member,groupId:b.dataset.group};renderOverlay();return}else if(a==='save-form'){saveForm(b.closest('form'));return}else if(a==='route'){route=b.dataset.route;profileTab='';filter='';overlay=null;render();document.querySelector('.content').scrollTop=0}else if(a==='add')newEntry(b.dataset.kind,b.dataset.date);else if(a==='close')closeOverlay();else if(a==='detail'){overlay={type:'detail',id};renderOverlay()}else if(a==='edit'){const item=state.items.find(x=>x.id===id);if(!item||!canManage(item))return;overlay={type:'form',item:{...item}};renderOverlay()}else if(a==='toggle'){const item=state.items.find(x=>x.id===id);if(!item||!canManage(item))return;item.done=!item.done;persist();render();toast(item.done?'Marked completed':'Reopened')}else if(a==='delete-ask'){overlay={type:'delete',id};renderOverlay()}else if(a==='delete'){const item=state.items.find(x=>x.id===id);if(item?.kind==='group'&&state.items.some(t=>t.groupId===id)){toast('Reassign or delete the group tasks before deleting this group.');return}if(!item||!canManage(item))return;state.items=state.items.filter(x=>x.id!==id);persist();overlay=null;render();toast('Entry deleted')}else if(a==='month'){calendarOffset=Math.max(-6,Math.min(6,calendarOffset+Number(b.dataset.step)));render()}else if(a==='today'){calendarOffset=0;render()}else if(a==='day'){overlay={type:'day',date:b.dataset.date};renderOverlay()}else if(a==='profile-tab'){profileTab=b.dataset.tab;render();document.querySelector('.content').scrollTop=0}else if(a==='profile-edit'){overlay={type:'profile'};renderOverlay()}else if(a==='theme'){state.theme=b.dataset.theme;persist();render()}else if(a==='mono'){state.mono=!state.mono;persist();render()}else if(a==='add-module'){state.modules.push({id:newId(),name:'New module',code:'NEW',color:'#6b8fc7'});persist();render()}else if(a==='remove-module'){if(state.items.some(x=>x.moduleId===id)){toast('This module is used by entries. Reassign or delete those entries first.');return}state.modules=state.modules.filter(m=>m.id!==id);persist();render()}else if(a==='save-modules'){persist();toast(storageOk?'Modules saved. Entry colors update automatically.':'Saved for this session only.')}});
app.addEventListener('change',e=>{const el=e.target;if(el.id==='task-type'||el.id==='task-group'){syncTaskGroup();return}else if(el.id==='entry-module'){el.closest('.module-field').style.setProperty('--module',color(moduleFor(el.value)))}else if(el.dataset.moduleColor){const m=moduleFor(el.dataset.moduleColor);m.color=el.value;persist()}else if(el.dataset.moduleName){moduleFor(el.dataset.moduleName).name=el.value.trim()||'New module';persist()}else if(el.dataset.moduleCode){moduleFor(el.dataset.moduleCode).code=el.value.trim();persist()}});
app.addEventListener('input',e=>{if(e.target.id==='list-search'){filter=e.target.value;const kind=route==='tasks'?'task':route==='exams'?'exam':'group';const list=visibleItems().filter(x=>x.kind===kind&&(x.title+' '+x.description+' '+moduleFor(x.moduleId).name).toLowerCase().includes(filter.toLowerCase()));document.getElementById('item-list').innerHTML=sorted(list).map(card).join('')||'<div class="empty">No matching entries.</div>'}});
function formError(form,message,name){const box=form.querySelector('.form-error');box.textContent=message;box.hidden=false;const control=name?form.elements.namedItem(name):null;if(control){control.setAttribute('aria-invalid','true');control.focus({preventScroll:true});control.scrollIntoView?.({block:'center'})}else box.scrollIntoView?.({block:'nearest'});return false}
function saveForm(form){if(!form)return false;const data={};for(const el of form.elements){if(el.name&&!el.disabled&&el.type!=='checkbox')data[el.name]=el.value}form.querySelectorAll('[aria-invalid]').forEach(el=>el.removeAttribute('aria-invalid'));try{if(form.getAttribute('id')==='entry-form'){const description=String(data.description||'').trim(),title=String(data.title||'').trim()||description.split(/\r?\n/)[0].slice(0,140);if(!title)return formError(form,'Enter a task title or write a description first.','description');const selectedGroup=data.kind==='task'&&data.workType==='group'?state.items.find(g=>g.kind==='group'&&g.id===data.groupId):null;if(data.kind==='task'&&data.workType==='group'&&!selectedGroup)return formError(form,'Choose a group. Create one under Groups first.','groupId');if(selectedGroup)data.moduleId=selectedGroup.moduleId;else data.groupId='';if(!state.modules.some(m=>m.id===data.moduleId))return formError(form,'Choose a module.','moduleId');if(!data.due||Number.isNaN(new Date(data.due).getTime())||!form.elements.namedItem('due').validity.valid)return formError(form,'Choose a valid date and time.','due');if(data.kind==='exam'&&(!data.duration||Number(data.duration)<1||Number(data.duration)>600))return formError(form,'Enter a duration between 1 and 600 minutes.','duration');const existing=state.items.find(x=>x.id===data.entryId),item={...existing,...data,id:data.entryId||newId(),title,description,done:existing?.done||false,ownerId:existing?.ownerId||state.activeUser};if(existing&&!canManage(existing))return formError(form,'Only the organizer can edit this group.');if(item.kind==='group'){item.memberIds=personIds(data.members||'');item.members=item.memberIds.map(userName).join(', ');delete item.responses}if(item.kind==='task'&&item.workType!=='group')item.groupId='';if(existing)state.items=state.items.map(x=>x.id===item.id?item:x);else state.items.push(item);if(item.kind==='group')for(const task of state.items){if(task.kind==='task'&&task.groupId===item.id)task.moduleId=item.moduleId}persist();overlay=null;route=item.kind==='task'?'tasks':item.kind==='exam'?'exams':'groups';filter='';render();toast(storageOk?(existing?'Changes saved':item.kind==='group'?`Group created · ${item.memberIds.length+1} members`:'Entry created'):'Saved for this session only. Your browser is blocking permanent storage.');return true}else if(form.getAttribute('id')==='profile-form'){if(!String(data.name||'').trim())return formError(form,'Enter your name.','name');state.profile={...state.profile,name:data.name.trim(),degree:data.degree,studyMode:data.studyMode,semesterTerm:data.semesterTerm,semesterYear:data.semesterYear,semester:data.semesterTerm+' '+data.semesterYear};persist();overlay=null;render();toast(storageOk?'Profile saved':'Saved for this session only.');return true}}catch(error){return formError(form,'Saving did not finish. Your text is still here; please try again.')}return formError(form,'This form could not be saved. Please reopen the entry form.')}
app.addEventListener('submit',e=>{e.preventDefault();saveForm(e.target)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlay()});
const shownReminders=new Set();function checkReminders(){const now=Date.now();for(const item of visibleItems()){if(item.done||item.reminder==='none')continue;const at=new Date(item.due).getTime()-Number(item.reminder)*60000,key=state.activeUser+':'+item.id+':'+item.due+':'+item.reminder;if(now>=at&&now<at+60000&&!shownReminders.has(key)){shownReminders.add(key);toast('Reminder: '+item.title+' · '+dateText(item.due))}}}
setInterval(checkReminders,30000);render();
</script></body></html>
